[tools]
# ── Languages & package managers ───────────────────────────────────────────
node  = "24"               # Next.js 16 + React 19 + AI SDK 7 baseline
pnpm  = "12"               # Repo policy; do not swap for npm/bun
python = "3.12"            # apps/scraper target; matches pyproject requires-python
uv    = "latest"           # uv moves fast; lockfile pins actual versions

# ── Runtime services ───────────────────────────────────────────────────────
# pg0: vectorize-io/pg0 — embedded Postgres 18 + pgvector, replaces Docker.
# Distributed only as GitHub release binaries (no crates.io, no npm, no brew).
# The `http:` backend's per-platform table lets us pin the exact version
# (matches the GitHub release tag `v0.15.2`) while letting `os()` / `arch()`
# template variables pick the correct binary per machine. Checksums are
# resolved by `mise sync` (see mise.lock) so version bumps don't require
# manual sha256 lookups. Upstream install.sh handles the glibc/musl switch,
# but we already know macOS hosts and the gnu Linux CI runner are our only
# targets today; add the musl variants if Alpine shows up.
[tools."http:pg0"]
version = "0.15.2"
url = "https://github.com/vectorize-io/pg0/releases/download/v{{ version }}/pg0-darwin-aarch64"
bin = "pg0"

[tools."http:pg0".platforms]
macos-arm64 = { url = "https://github.com/vectorize-io/pg0/releases/download/v{{ version }}/pg0-darwin-aarch64" }
macos-x64   = { url = "https://github.com/vectorize-io/pg0/releases/download/v{{ version }}/pg0-darwin-x86_64" }
linux-x64   = { url = "https://github.com/vectorize-io/pg0/releases/download/v{{ version }}/pg0-linux-x86_64-gnu" }
linux-arm64 = { url = "https://github.com/vectorize-io/pg0/releases/download/v{{ version }}/pg0-linux-aarch64-gnu" }
windows-x64 = { url = "https://github.com/vectorize-io/pg0/releases/download/v{{ version }}/pg0-windows-x86_64.exe", bin = "pg0.exe" }

ffmpeg = "latest"          # Screenshot/video capture; also ffprobe for video:durations

# ── Demo video audio (apps/video) ──────────────────────────────────────────
# pocket-tts narrates the demo VO (`mise run video:tts`). The pypi backend
# resolves it via `uv tool`; `brew install pocket-tts` is the fallback if
# the pin misbehaves on a host. audio.cpp (music bed, `mise run
# video:music`) has no usable mise backend: its GitHub releases ship the
# CLI, model manager and framework as separate tarballs the github backend
# cannot assemble, so it stays brew-only. See apps/video/README.md.
"pypi:pocket-tts" = "3.1.0"

# ── Repo automation ────────────────────────────────────────────────────────
lefthook = "latest"        # Pre-push hook → `mise run validate`

# ── Lint / format / type (oxc project; versions track together) ────────────
"npm:oxlint"           = "1.77"     # Linter (matches AGENTS.md pin)
"npm:oxlint-tsgolint"  = "7"        # Type-aware rules; must match oxlint minor
"npm:oxfmt"            = "0.60"     # Formatter (matches AGENTS.md pin)

# ── Frontend validation tools ──────────────────────────────────────────────
# Tier 1 — app-level browser control. Stable @eN accessibility refs for LLM
# agents, parallel sessions, optional `chat` subcommand. Pin globally so every
# teammate + agent has the same version on `mise install`.
"npm:agent-browser"    = "latest"

# Tier 1 fallback — raw Playwright CLI (uses the same Chromium binary as
# agent-browser under the hood).
"npm:playwright"       = { version = "latest", lazy = true }  # ~650 MB deferred

# Tier 2 — component-level isolation. Use when app-level setup is conflicting
# or polluted; `pnpm dlx react-cosmos dev` from apps/web mounts each component
# in its own sandboxed fixture.
"npm:react-cosmos"     = "latest"

# ── Repository hygiene (lazy — only pulled when first used) ────────────────
"github:rhysd/actionlint"   = { version = "latest", lazy = true }
"github:koalaman/shellcheck" = { version = "latest", lazy = true }
"github:hadolint/hadolint"   = { version = "latest", lazy = true }

[env]
# uv: keep editable .venv entries as symlinks into the global cache. Hardlink
# mode silently inflates disk on mv/tar via APFS CoW-materialize. The venv is
# project-local per worktree because uv's editable-install .pth files embed
# absolute paths to the source directory of the worktree that last ran
# `uv sync` — sharing .venv across worktrees poisons the source resolution
# silently. See .agents/docs/worktree-disk-budget.md.
UV_LINK_MODE            = "symlink"

# Mirrors pyproject's [tool.uv] compile-bytecode = false as belt-and-suspenders.
PYTHONDONTWRITEBYTECODE = "1"

# Raise V8 heap before Next.js + AI SDK 7 hit OOM during builds on 16 GB macs.
NODE_OPTIONS            = "--max-old-space-size=4096"

# Make mise exec find locally-pnpm-installed CLIs without `pnpm exec`.
_.path                  = ["./node_modules/.bin"]

# ── Tasks ──────────────────────────────────────────────────────────────────

[tasks."db:start"]
description = "Start pg0 (embedded Postgres 18 + pgvector) on :5432"
run = "pg0 start --port 5432"

[tasks."db:stop"]
description = "Stop the local pg0 instance"
run = "pg0 stop --port 5432"

[tasks."db:reset"]
description = "Reset the local pg0 database (drops + recreates)"
run = "pg0 reset --port 5432"

[tasks."db:status"]
description = "Show pg0 instance status"
run = "pg0 info"

[tasks."db:seed"]
description = "Load chezy-mock-data/data/listings.jsonl into the Listing table (idempotent upsert)"
run = "cd apps/web && node --env-file-if-exists=.env.local --import=tsx scripts/seed-listings.ts"

[tasks."demo:setup"]
description = "Start pg0, migrate and seed rental fixtures without resetting user data"
run = [
  """pg0 info --output json | node -e 'process.exit(JSON.parse(require("node:fs").readFileSync(0, "utf8")).running ? 0 : 1)' || mise run db:start""",
  "cd apps/web && node --env-file-if-exists=.env.local --import=tsx lib/db/migrate.ts",
  "mise run db:seed",
]

[tasks."demo:check"]
description = "Verify repeatable persona, fixture candidates, transactional rollback and user isolation"
run = "cd apps/web && node --env-file-if-exists=.env.local --import=tsx scripts/check-demo.ts"

[tasks."slng:agent:sync"]
description = "Pin the SLNG agent to eu-central/livekit and report its outbound trunk"
# cd into apps/web so tsx picks up its tsconfig `@/*` paths.
run = "cd apps/web && node --env-file-if-exists=.env.local --import=tsx scripts/slng-agent-sync.ts"

[tasks."bot:dev"]
description = "Run the Telegram bot (polling) via tsx watch"
run = "pnpm --filter @chezy/bot dev"

[tasks."bot:start"]
description = "Run the Telegram bot (polling) via tsx"
run = "pnpm --filter @chezy/bot start"

[tasks."bot:test"]
description = "Run the apps/bot vitest suite against the fake Telegram"
run = "pnpm --filter @chezy/bot test"

[tasks."bot:radar"]
description = "Trigger one radar pass via POST /internal/radar/run (needs BOT_INTERNAL_TOKEN)"
run = "curl -sf -X POST -H \"x-internal-token: ${BOT_INTERNAL_TOKEN:?set BOT_INTERNAL_TOKEN}\" \"http://127.0.0.1:${BOT_PORT:-4111}/internal/radar/run\""

[tasks.lint]
description = "Lint TS (oxlint) + Python (ruff) workspaces"
run = "pnpm lint && uv run --all-packages ruff check ."

[tasks."lint:ts"]
description = "Lint TS only (oxlint)"
run = "pnpm lint"

[tasks."lint:py"]
description = "Lint Python only (ruff)"
run = "uv run --all-packages ruff check ."

[tasks.typecheck]
description = "Typecheck TS (tsc -b) + Python (basedpyright)"
run = "pnpm typecheck && uv run --all-packages basedpyright ."

[tasks."typecheck:ts"]
description = "tsc -b across the pnpm workspace"
run = "pnpm typecheck"

[tasks."typecheck:py"]
description = "basedpyright strict on the uv workspace"
run = "uv run --all-packages basedpyright ."

[tasks.format]
description = "Format TS (oxfmt) + Python (ruff format)"
run = "pnpm format && uv run --all-packages ruff format ."

[tasks."format:check"]
description = "Check formatting without writing (CI mode)"
run = "pnpm format:check && uv run --all-packages ruff format --check ."

[tasks.test]
description = "Run tests (vitest TS + pytest Py) across the workspaces"
run = "pnpm test && uv run --all-packages pytest"

[tasks."test:ts"]
description = "Vitest only"
run = "pnpm test"

[tasks."test:py"]
description = "pytest only"
run = "uv run --all-packages pytest"

[tasks."test:affected"]
description = "Coverage-based affected-test selection (pytest-testmon today; vitest --filter when feature lands)"
run = "uv run --all-packages pytest --testmon"

# Two-tier validate gate. `validate:quick` is the in-loop tier (~10-30s warm);
# `validate` is the pre-push tier (full suite). Both self-skip when no relevant
# files changed vs origin/main. The validate scripts are `scripts/validate.ts`
# and `scripts/validate.py`. See .agents/notes/2026-09-19.md for rationale.

[tasks.validate]
run = "tsx scripts/validate.ts && python3 scripts/validate.py"
description = "Fast merge gate: TS typecheck/lint/format/test + Python ruff/format/basedpyright/pytest. Both self-skip when nothing relevant to that language changed vs origin/main. Same gate CI runs on every branch push."

[tasks."validate:ts"]
run = "tsx scripts/validate.ts"
description = "TS-only validate. Use in Python-empty worktrees."

[tasks."validate:py"]
run = "python3 scripts/validate.py"
description = "Python-only validate. Use in TS-empty worktrees."

[tasks."validate:quick"]
run = "tsx scripts/validate.ts --quick && python3 scripts/validate.py --quick"
description = "In-loop fast tier (~10-30s warm): typecheck + lint + format:check + ruff + structural scripts, no vitest/pytest/basedpyright. NOT a substitute for validate; the pre-push hook still runs the full suite."

[tasks."validate:full"]
depends = ["validate"]
description = "Full merge gate: validate plus Playwright e2e (LAZY — only runs when tests/e2e/** changed vs origin/main; no-op until e2e suite lands)."

[tasks."test:e2e"]
description = "Playwright e2e suite. Lazy-installed: only `playwright install chromium` on first run. Tests live under tests/e2e/**."
run = "pnpm exec playwright test"

[tasks."hooks:install"]
description = "Install lefthook git hooks (also runs on `pnpm install` via the root `prepare` script)"
run = "lefthook install"

[tasks."wt:init"]
description = "Initialize a new worktree: copy .env, run pnpm install, uv sync --all-packages, then db:start"
run = "bash scripts/worktree-init.sh"

[tasks.setup]
description = "First-time setup: wt:init (deps, .env.local, pg0), then migrate and seed the listings"
run = "mise run wt:init && pnpm --filter @chezy/web db:migrate && mise run db:seed"

[tasks.dev]
description = "Run the web dev server (Next.js 16)"
run = "pnpm --filter @chezy/web dev"

[tasks.build]
description = "Build all workspaces"
run = "pnpm build"

[tasks."cosmos"]
description = "Tier-2 component validation. Spawns react-cosmos dev server for isolated component fixtures. Use when app-level setup (apps/web dev server) is conflicting or polluted."
run = "pnpm --filter @chezy/web cosmos"

[tasks."browser:smoke"]
description = "Tier-1 app-level validation. Spawns agent-browser for a one-off smoke check against the dev server."
run = "agent-browser --help"

[tasks."listings:enrich"]
description = "Extract VLM photo insights into ListingInsight (idempotent; --limit N --force --concurrency K --model ID)"
run = "cd apps/web && node --env-file-if-exists=.env.local --import=tsx scripts/enrich-listings.ts"

# ── Demo video (apps/video, Remotion) ──────────────────────────────────────
# Plan: .agents/plans/2026-09-19-demo-video.md. M1 + 8 GB: never run
# video:render while video:preview (Studio) or the Next dev server is up.

[tasks."video:tts"]
description = "Synthesize VO WAVs with pocket-tts (sha256-of-text+voice cache; unchanged segments skipped) + 3 intro voice samples"
run = "cd apps/video && tsx scripts/tts.ts"

[tasks."video:durations"]
description = "ffprobe each VO WAV -> apps/video/src/generated/durations.json"
run = "cd apps/video && tsx scripts/durations.ts"

[tasks."video:capture-doc"]
description = "Generate apps/video/CAPTURE.md (per-checkpoint capture contract) from demo.config.ts + copy"
run = "cd apps/video && tsx scripts/capture-doc.ts"

[tasks."video:srt"]
description = "Generate apps/video/out/chezy-demo.srt captions sidecar from copy + durations"
run = "cd apps/video && tsx scripts/srt.ts"

[tasks."video:check"]
description = "Fail if total >175s, a VO WAV is missing, a clip source file is missing, or footer.repoUrl is unset while showMockTags is false"
run = "cd apps/video && tsx scripts/check.ts"

[tasks."video:preview"]
description = "Remotion Studio for the demo video (do not run concurrently with video:render)"
run = "cd apps/video && pnpm exec remotion studio src/index.ts"

[tasks."video:render"]
description = "Render out/chezy-demo.mp4 (1920x1080 30fps h264 + aac, concurrency 2). Never run with Studio or the Next dev server up."
run = "cd apps/video && pnpm exec remotion render src/index.ts ChezyDemo out/chezy-demo.mp4 --codec h264 --audio-codec aac --audio-bitrate 192k --concurrency 2"

[tasks."video:music"]
description = "Generate the ambient music bed via audiocpp (Stable Audio 3 Medium default, MUSIC_MODEL=small for the lighter model, Metal) -> public/audio/music/bed.wav. See apps/video/docs/music.md"
run = "bash apps/video/scripts/music.sh"

[tasks."video:all"]
description = "Full video pipeline: tts -> durations -> capture-doc -> srt -> check -> render"
run = "mise run video:tts && mise run video:durations && mise run video:capture-doc && mise run video:srt && mise run video:check && mise run video:render"

[tasks."eval:trace"]
description = "LLM tool-call trace eval for demo happy path A against a running dev server (default http://localhost:4656; pass another URL as the first arg). Writes /tmp/chezy-eval/tool-trace-<ts>.json. See docs/checkpoints/."
run = "cd apps/web && node --env-file-if-exists=.env.local --import=tsx evals/tool-trace.eval.ts"

[tasks."eval:seed"]
description = "Seed the 'jessie' demo user with a fully onboarded profile into pg0 (idempotent upsert)."
run = "cd apps/web && node --env-file-if-exists=.env.local --require=./evals/preload.cjs --import=tsx evals/seed-jessie.ts"

[tasks."eval:galtea:setup"]
description = "Idempotent Galtea setup: product, specs, metrics, datasets for the Chezy eval harness. Needs GALTEA_API_KEY (root .env) and a dev server is NOT required."
run = "set -a && . ./.env && set +a && uv run --package chezy-evals python -m chezy_evals.setup"

[tasks."eval:galtea:run"]
description = "Run a Galtea evaluation pass against the dev server on :4656. Usage: mise run eval:galtea:run -- --version <git-sha>"
run = "set -a && . ./.env && set +a && uv run --package chezy-evals python -m chezy_evals.run"
