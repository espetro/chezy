[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chezy-evals"
version = "0.0.0"
description = "Galtea evaluation harness for the Chezy web app (agent adapter + setup/run scripts)."
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "galtea>=5.3,<6",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chezy_evals"]
