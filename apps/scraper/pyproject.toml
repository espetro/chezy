[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chezy-scraper"
version = "0.0.0"
description = "Barcelona listing extraction pipeline (CLI): fotocasa, habitaclia, idealista."
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"

# Pin structlog to a 24.x release; 25.0 reorganized processors and broke
# the renderer pattern we use for the JSONL audit sink.
dependencies = [
    "structlog>=24.4.0,<25",
    "httpx>=0.27",
    "parsel>=1.9",
    "pydantic>=2.9",
    "typer>=0.12",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "tenacity>=9.0",
    "websockets>=13.0",
]

[project.scripts]
# `uv run scraper` will (eventually) invoke this entry point. Day 0 only
# prints a hello message; feature tickets add real scraping pipelines.
scraper = "chezy_scraper.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chezy_scraper"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-randomly>=3.15",
    "ruff>=0.16",
    "basedpyright>=1.40.1",
]
