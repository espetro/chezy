<html><head><title>habitaclia fixture</title></head><body><script>window.__INITIAL_PROPS__ = JSON.parse("{\"initialSearchResultsPage\": {\"status\": \"success\", \"initialSearchContext\": {\"results\": {\"items\": [{\"id\": \"1d7a0d53-02d6-4a17-8228-a321cf7f4d0f\", \"legacyNumericId\": \"10636002656060\", \"kind\": \"secondHand\", \"navigationUrl\": \"/i10636002656060.htm?from=list\", \"summary\": {\"title\": \"Espectacular \u00c1ticoD\u00faplex de 236m2 con Vistas Panor\u00e1micas en Sant GervasiGalvany\", \"description\": \"Espectacular \u00c1tico-D\u00faplex de 236m2 con Vistas Panor\u00e1micas en Sant Gervasi-Galvany\\n\\n\u00a1Listo para entrar a vivir! Se alquila exclusivo \u00e1tico-d\u00faplex reci\u00e9n reformado integralmente, ubicado en el prestigioso y tranquilo barrio residencial de Sant Gervasi-Galvany. Una vivienda \u00fanica que destaca por su luminosidad, su amplitud y 3 fant\u00e1sticas terrazas con vistas espectaculares a toda Barcelona.\\n\\n\u00b7 Distribuci\u00f3n Inteligente en Dos Plantas\\nPlanta Baja (Zona de d\u00eda y descanso):\\n\\n- Gran sal\u00f3n-comedor muy luminoso con chimenea y con acceso directo a la terraza principal y vistas panor\u00e1micas de la ciudad.\\n\\n- Cocina independiente totalmente equipada, con acceso a zona de lavadero y \u00e1rea de servicio.\\n\\n- 4 Habitaciones : 2 de ellas tipo suite con ba\u00f1o privado (una con salida a terraza privada). Las otras 2 habitaciones comparten un ba\u00f1o completo con plato de ducha.\\n\\n- Pasillo distribuidor con armarios empotrados de gran capacidad.\\n\\n\u00b7 Primera Planta (Espacio polivalente o zona m\u00e1ster):\\n\\n- 1 Habitaci\u00f3n principal de gran tama\u00f1o con salida a una tercera terraza de ensue\u00f1o y vistas despejadas.\\n\\n- 2 Habitaciones adicionales que comparten un ba\u00f1o completo con plato de ducha.\\n\\n- Pasillo con armarios empotrados adicionales.\\n\\n* Calidades y Acabados Premium\\n- Reforma integral a estrenar con materiales de alta calidad.\\n\\n- Suelos de elegante parquet en todas las estancias.\\n\\n- Cerramientos de aluminio con doble cristal (aislamiento t\u00e9rmico y ac\u00fastico total).\\n\\n- Sistema de climatizaci\u00f3n por bomba de aire fr\u00edo/calor.\\n\\n\u00b7 Seguridad y servicios\\nEl edificio posee servicio de conserjer\u00eda de lunes a viernes y portero fines de semana y festivos; y servicio de vigilancia las 24hs.\\n\\n\u00b7 Ubicaci\u00f3n e Inmejorable Conectividad\\nSituado en una de las zonas m\u00e1s exclusivas de Barcelona, rodeado de zonas verdes, prestigiosos centros m\u00e9dicos y los mejores colegios internacionales y nacionales de la ciudad. Cuenta con todo tipo de comercios y servicios a pie de calle.\\n\\n\u00b7 Transporte p\u00fablico: Excelente conexi\u00f3n con Ferrocarriles de la Generalitat (FGC), Metro y m\u00faltiples l\u00edneas de autob\u00fas.\\n\\n\u00b7 Conexi\u00f3n en coche: Acceso r\u00e1pido y directo a la Ronda de Dalt (B-20) y Ronda del General Mitre.\\n\\nQuieres vivir en una de las mejores propiedades de Barcelona?\\nNo dejes escapar esta oportunidad \u00fanica. \\nLl\u00e1mame hoy mismo y concertamos una visita!\\nEn cumplimiento del art. 20 de la Ley General para la defensa de los consumidores y usuarios (modificado por la Ley 10/2025), se informa que el PRECIO MENSUAL OFERTADO DE RENTA DE LA VIVIENDA es: 832\u202f\u20ac, no incluye gastos e impuestos inherentes a la formalizaci\u00f3n del contrato de arrendamiento de vivienda para uso estable y permanente, correspondiendo al inquilino/arrendatario:\\n\\n(I) IMPUESTOS: Actualmente, el inquilino de vivienda para uso estable y permanente est\u00e1 exento de pagar el impuesto sobre transmisiones patrimoniales y actos jur\u00eddicos documentados, modalidad transmisiones patrimoniales onerosas. Se trata de una operaci\u00f3n sujeta y exenta de pago (c\u00f3digo de exenci\u00f3n 145) y, por tanto, existe la obligaci\u00f3n de presentar la autoliquidaci\u00f3n del modelo 600. Para una informaci\u00f3n m\u00e1s exhaustiva sobre este punto, pueden consultarnos o consultar el portal oficial de la Agencia Tributaria de Catalu\u00f1a.\\n\\n(II) GASTOS: Arrendador y arrendatario podr\u00e1n pactar que los gastos generales para el adecuado sostenimiento del inmueble, sus servicios, tributos, cargas y responsabilidades que no sean susceptibles de individualizaci\u00f3n y que correspondan a la vivienda arrendada o a sus accesorios, sean a cargo del arrendatario. Este pacto constar\u00e1 por escrito y determinar\u00e1 el importe anual de dichos gastos. Los que se individualizan por aparatos contadores ser\u00e1n del arrendatario.\\n\\n(III) Honorarios de la agencia inmobiliaria: No cobramos comisi\u00f3n al inquilino. En caso de pacto de honorarios profesionales a cargo del inquilino, se suscribir\u00e1 el correspondiente documento\", \"location\": {\"visibility\": \"ZONE\", \"municipality\": \"Barcelona Capital\", \"district\": \"Sarri\u00e0 - Sant Gervasi\", \"region\": \"Barcelon\u00e8s\", \"province\": \"Barcelona\", \"address\": {\"streetName\": \" FERRAN VALLS I TABERNER\", \"streetNumber\": \"14\"}, \"coordinates\": {\"latitude\": 41.403515450732, \"longitude\": 2.1411799532534}, \"displayAddressLine\": null, \"displayZoneLine\": \"Sarri\u00e0 - Sant Gervasi, Barcelona Capital\", \"layers\": [{\"type\": \"neighbourhood\", \"value\": \"Sant Gervasi- Galvany\"}, {\"type\": \"country\", \"value\": \"Espa\u00f1a\"}, {\"type\": \"autonomous_community\", \"value\": \"Catalu\u00f1a\"}, {\"type\": \"province\", \"value\": \"Barcelona\"}, {\"type\": \"region\", \"value\": \"Barcelon\u00e8s\"}, {\"type\": \"area\", \"value\": \"Barcelona, Zona de\"}, {\"type\": \"municipality\", \"value\": \"Barcelona Capital\"}, {\"type\": \"district\", \"value\": \"Sarri\u00e0 - Sant Gervasi\"}, {\"type\": \"street\", \"value\": \"Calle Berlines\"}, {\"type\": \"street\", \"value\": \"Calle Corint\"}, {\"type\": \"street\", \"value\": \"Calle Ferran Valls i Taberner\"}, {\"type\": \ , {\"id\": \"014dca68-1aa8-4b49-b049-13b2a036824f\", \"legacyNumericId\": \"9863004320227\", \"kind\": \"secondHand\", \"navigationUrl\": \"/i9863004320227.htm?from=list\", \"summary\": {\"title\": \"\u00a1Vive en el Coraz\u00f3n de Barcelona en este Exclusivo y Luminoso Piso con Terraza!\", \"description\": \"Ubicaci\u00f3n Premium, Dise\u00f1o Elegante y Comodidad \u00danica\\n\\nImagina vivir en uno de los barrios m\u00e1s codiciados de Barcelona, en un piso que lo tiene todo: luz natural, vistas despejadas, espacios amplios y una reforma reciente que aporta estilo y funcionalidad. Este exclusivo piso en la Diagonal, ubicado en una finca con conserje y dos ascensores, ha sido dise\u00f1ado para ofrecerte lo mejor en confort y calidad de vida. \u00a1Tu nuevo hogar te est\u00e1 esperando!\\n\\nDistribuci\u00f3n Perfecta para Tu Comodidad\\n\\nEste hogar ocupa toda una planta, con dos accesos que permiten una distribuci\u00f3n fluida y c\u00f3moda. Al entrar, ser\u00e1s recibido por un espacioso hall que te llevar\u00e1 a una cocina independiente y moderna, equipada con gran capacidad de almacenamiento y un pr\u00e1ctico lavadero. Adem\u00e1s, cuenta con un \u00e1rea extra que puedes adaptar a tus necesidades, ya sea como habitaci\u00f3n de servicio o despensa.\\n\\nA tu izquierda, un sal\u00f3n de generosas dimensiones, con grandes ventanales que permiten que la luz inunde el espacio. Desde el sal\u00f3n, accedes a una terraza privada con impresionantes vistas a la Diagonal, perfecta para disfrutar de tus momentos de relax al aire libre.\\n\\nZonas de Noche para Toda la Familia\\n\\nLa zona de descanso de este espectacular piso te ofrece 4 habitaciones dobles, todas exteriores y llenas de luz. La suite principal, con vestidor y ba\u00f1o privado, tiene acceso directo a la terraza, convirti\u00e9ndola en tu peque\u00f1o refugio. Las otras habitaciones, amplias y confortables, ideal para disfrutar de tranquilidad y vistas a la zona norte de la ciudad.\\n\\nCalidad en Cada Detalle\\n\\nEste hogar est\u00e1 equipado con calefacci\u00f3n individual a gas y aire acondicionado por conductos, para garantizar tu bienestar todo el a\u00f1o. Los suelos de parquet de madera noble a\u00f1aden calidez al espacio, mientras que la cocina y los ba\u00f1os cuentan con acabados en terrazo de alta gama, que aportan elegancia y durabilidad.\\n\\nZonas Comunes para Disfrutar en Familia\\n\\nImagina tener acceso a una zona comunitaria con espacios verdes, un parque infantil y una zona deportiva, todo a tu disposici\u00f3n. Adem\u00e1s, la propiedad incluye una plaza de parking de gran tama\u00f1o y un trastero de 10 m\u00b2, lo que te ofrece una comodidad extra y mucho espacio para almacenamiento.\\n\\nTodo lo que Necesitas a tu Alcance\\n\\nEste piso est\u00e1 en la ubicaci\u00f3n perfecta: a pocos pasos de transporte p\u00fablico, tiendas, restaurantes y zonas de ocio. Vivir en la Diagonal te permite disfrutar de la calma y el lujo de una zona residencial, sin perderte la vibrante vida urbana de Barcelona.\\n\\nNo Dejes Pasar Esta Oportunidad \u00danica\\n\\nEste es m\u00e1s que un piso, es tu nuevo hogar. No dejes pasar la oportunidad de vivir en una de las zonas m\u00e1s exclusivas de la ciudad. \u00a1Solicita tu visita hoy mismo y ven a descubrir todo lo que este espectacular piso tiene para ofrecer!\\n\\nZONA TENSIONADA\\nPROPIEDAD NO GRAN TENEDORA\\nEste inmueble cuenta con una superficie superior a 150 m\u00b2, por lo que no dispone de \u00edndice de referencia de precios de alquiler publicado por el Ministerio de Vivienda.\", \"location\": {\"visibility\": \"EXACT\", \"municipality\": \"Barcelona Capital\", \"district\": \"Les Corts\", \"region\": \"Barcelon\u00e8s\", \"province\": \"Barcelona\", \"address\": {\"streetName\": \"Carrer del Capit\u00e0 Arenas\", \"streetNumber\": \"3\"}, \"coordinates\": {\"latitude\": 41.3892013, \"longitude\": 2.1265986}, \"displayAddressLine\": \"Carrer del Capit\u00e0 Arenas 3\", \"displayZoneLine\": \"L ada y con zona de comedor. La primera planta alberga tres dormitorios dobles en suite, con suelos de parquet y dos de ellos con salida a terrazas privadas de 10 y 30 m\u00b2. En la planta superior encontramos un luminoso estudio con acceso a una agradable terraza de 20 m\u00b2.\\nLa propiedad se completa con zona de aguas, plaza de aparcamiento y equipamientos como alarma, persianas automatizadas, aerotermia y climatizaci\u00f3n por conductos fr\u00edo/calor.\\nUna propiedad singular que combina privacidad, espacios exteriores y confort en uno de los entornos residenciales m\u00e1s atractivos de Gr\u00e0cia.\\nAICAT 145 \u00b7 API 1519 | CEE: 0B0QT4P7W | Sin \u00edndice estatal de referencia. Precio determinado por la \u00faltima renta actualizada: 4.000 \u20ac. Gastos incluidos en el precio total del alquiler.\\r\\n\u00cdndice inf.: 7,38 \u20ac/m2/mes | \u00cdndice: 8,97 \u20ac/m2/mes | \u00cdndice sup.: 13,54 \u20ac/m2/mes\", \"location\": {\"visibility\": \"STREET\", \"municipality\": \"Barcelona Capital\", \"district\": \"Gr\u00e0cia\", \"region\": \"Barcelon\u00e8s\", \"province\": \"Barcelona\", \"address\": {\"streetName\": \"MARE DE DEU DEL COLL\", \"streetNumber\": \"35\"}, \"coordinates\": {\"latitude\": 41.415495, \"longitude\": 2.145644}, \"displayAddressLine\": \"MARE DE DEU DEL COLL\", \"displayZoneLine\": \"Gr\u00e0cia, Barcelona Capital\", \"layers\": [{\"type\": \"neighbourhood\", \"value\": \"Vallcarca i els Penitents\"}, {\"type\": \"country\", \"value\": \"Espa\u00f1a\"}, {\"type\": \"autonomous_community\", \"value\": \"Catalu\u00f1a\"}, {\"type\": \"province\", \"value\": \"Barcelona\"}, {\"type\": \"region\", \"value\": \"Barcelon\u00e8s\"}, {\"type\": \"area\", \"value\": \"Barcelona, Zona de\"}, {\"type\": \"municipality\", \"value\": \"Barcelona Capital\"}, {\"type\": \"district\", \"value\": \"Gr\u00e0cia\"}, {\"type\": \"street\", \"value\": \"Plaza Flandes\"}, {\"type\": \"street\", \"value\": \"Calle Balears\"}, {\"type\": \"street\", \ ption\": \"PISO AMUEBLADO DE DOS HABITACIONES Y UN DESPACHO JUNTO A PLAZA CATALUNYA\\n\\nArrendamiento permitido \u00fanicamente para estancias superiores a treinta y dos (32) d\u00edas, con finalidad de ocio, vacacional, recreativa o cultural, quedando sujeta la formalizaci\u00f3n del contrato a la aportaci\u00f3n de la documentaci\u00f3n que acredite dicha finalidad.\\n\\nEn pleno coraz\u00f3n de Barcelona, entre plaza Catalunya y plaza Universidad, se encuentra este piso de aproximadamente 90 m\u00b2, situado en una finca rehabilitada y con disponibilidad inmediata. Ubicado en el barrio de Sant Antoni, combina la vida urbana del centro con la comodidad de tener tiendas, restaurantes y transporte p\u00fablico a pocos pasos. Una opci\u00f3n especialmente interesante para quienes buscan vivir en Barcelona con todo al alcance y disfrutar de una vivienda con personalidad.\\n\\nLa vivienda cuenta con un sal\u00f3n comedor luminoso y soleado, con salida a dos balcones, y una cocina de dise\u00f1o abierta, totalmente equipada. Dispone de dos habitaciones dobles con armarios, una de ellas en suite con ba\u00f1era, adem\u00e1s de un segundo ba\u00f1o con plato de ducha y una habitaci\u00f3n peque\u00f1a como despacho y un aseo de cortesia. Los techos altos y los suelos hidr\u00e1ulicos aportan car\u00e1cter, mientras que el parquet y el mosaico completan unos interiores cuidados. Tambi\u00e9n dispone de aire acondicionado y calefacci\u00f3n.\\n\\nLa ubicaci\u00f3n permite disfrutar del ritmo de la ciudad sin renunciar a la comodidad del d\u00eda a d\u00eda. Restaurantes, comercios, plazas y una excelente conexi\u00f3n con el transporte p\u00fablico rodean la vivienda, haciendo f\u00e1cil moverse por Barcelona tanto a pie como en transporte p\u00fablico.\\n\\nSi buscas un piso con encanto en el centro, bien comunicado y listo para entrar a vivir, esta vivienda puede encajar especialmente bien como residencia habitual o inversi\u00f3n.\\n\\nPara m\u00e1s informaci\u00f3n o c
