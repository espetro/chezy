 peatonal y tranquila, a pocos minutos de Passeig de Gràcia y Plaça Catalunya.\nSe trata de un ático dúplex único, diseñado al detalle, que combina amplitud, tecnología, confort y una cuidada selección de materiales premium. La vivienda destaca por su impresionante terraza de 60 m², ideal para disfrutar del clima de Barcelona, con ducha exterior, tomas de agua, iluminación integrada y toldos motorizados con sensor de lluvia y viento. Además incluye plaza de parking en el mismo edificio.\nLa propiedad consta de 133m2 útiles en la planta principal, más 62m2 de la buhardilla en la planta superior. La reforma integral se ha realizado con un altísimo nivel de exigencia, incorporando aislamiento acústico y térmico, carpinterías exteriores de gran calidad con vidrios de seguridad, suelo radiante por zonas, aerotermia, aire acondicionado por conductos también sectorizado y un completo sistema de domótica para el control de iluminación, climatización y otros elementos del hogar.\nLa zona de día ofrece una cocina de diseño totalmente a medida, equipada con electrodomésticos de alta gama paneleados, acabados sofisticados y una distribución pensada para el uso diario y para recibir invitados. Toda la vivienda cuenta con mobiliario a medida, armarios lacados e iluminados, así como un cuidado proyecto de iluminación LED en techos, paredes y zonas exteriores.\nEn la planta superior encontramos una atmósfera cálida y elegante, con parquet de roble natural. En la planta principal encontramos el salón, comedor, cocina con acceso a la terraza, dos suites y un baño de cortesía. Los baños han sido ejecutados con materiales nobles y una estética contemporánea.\nLa vivienda dispone además de cuarto de máquinas/lavadero, instalación completa de TV e internet en distintas estancias, estores motorizados y un sistema de sonido integrado.\nUna pieza verdaderamente singular para quien busca una vivienda irrepetible en el centro de Barcelona, con privacidad, silencio, terraza y acabados de máxim
