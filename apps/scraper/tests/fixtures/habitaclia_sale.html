<html><head><title>habitaclia fixture</title></head><body><script>window.__INITIAL_PROPS__ = JSON.parse("{\"initialSearchResultsPage\": {\"status\": \"success\", \"initialSearchContext\": {\"results\": {\"items\": [{\"id\": \"257ceca3-acdd-42a5-a5de-47742f3ab5a7\", \"legacyNumericId\": \"21311004317263\", \"kind\": \"secondHand\", \"navigationUrl\": \"/i21311004317263.htm?from=list\", \"summary\": {\"title\": \"Junto al Passeig Sant Joan, Finca Regia de 105 m2, 3 habitaciones, 1 ba\u00f1o, balc\u00f3n\", \"description\": \"Ubicado en una hermosa finca Regia con ascensor, en pleno coraz\u00f3n de l'Eixample, situado entre Passeig Sant Joan y la emblem\u00e1tica Sagrada Familia encontramos esta vivienda de 105m2, exterior a ambos lados, balc\u00f3n a calle y patio de manzana. Tiene una triple entrada de luz, calle, patio de manzana y un gran patio central que da equilibrio luminoso al piso. Proyecto de reforma y fotograf\u00edas en el estado original.\\n\\nLa vivienda tiene diversas opciones de redistribuci\u00f3n.\\n\\nLos techos son altos y se puede recuperar la b\u00f3veda catalana. Cuenta con un amplio sal\u00f3n comedor con salida a un acogedor balc\u00f3n extremadamente silencioso con orientaci\u00f3n mar, sol de ba\u00f1ana y tarde ideal para disfrutar de momentos de tranquilidad. \\n\\nLa propiedad dispone de 3 habitaciones (se puede recuperar la cuarta habitaci\u00f3n f\u00e1cilmente y ser\u00edan 3 dobles y una mediana amplia) actualmente son dos dobles (una de ellas con balc\u00f3n propio muy luminosa) y una mediana amplia con salida a un agradable balc\u00f3n, perfectas para adaptarse a tus necesidades. \\n\\nEl ba\u00f1o es amplio y funcional, con la posibilidad de redistribuir o incluso ampliar, lo que te ofrece flexibilidad para personalizar tu espacio.\\n\\nLa cocina es amplia, independiente, est\u00e1 completamente equipada y cuenta con una zona de lavado, facilitando as\u00ed las tareas del d\u00eda a d\u00eda.\\n\\nUbicado a solo 5 minutos a pie del parque de la Sagrada Fam\u00edlia y la Bas\u00edlica, este piso tambi\u00e9n se encuentra a 5 minutos andando de la parada de metro de Sagrada Familia (L2 y L5) y varias l\u00edneas de autob\u00fas que recorren de extremo a extremo la ciudad. La zona es tranquila y luminosa, perfecta para disfrutar de la vida urbana sin renunciar a la paz. CHB en tr\u00e1mite.\\n\\nEsta Finca Regia, construida en 1934 y en buen estado, se sit\u00faa en la segunda planta real con ascensor. Con orientaci\u00f3n norte-sur, el piso ofrece una distribuci\u00f3n \u00f3ptima y un ambiente acogedor. No pierdas la oportunidad de vivir en una de las mejores zonas de Barcelona. \u00a1Cont\u00e1ctanos para m\u00e1s informaci\u00f3n y ven a verlo!\\n\\nNota legal: En cumplimiento de la Ley 3/2017 del 13 de febrero de 2018 del C\u00f3digo Civil de Catalunya, se informa que los gastos notariales, registrales e impuestos aplicables (ITP o IVA + AJD) no est\u00e1n incluidos en el precio\\nITP o IVA: tipo vigente\\nAJD: tipo vigente\\nGastos notariales: registrales seg\u00fan aranceles.\\nRegistro calificaci\u00f3n energ\u00e9ticaW5J2BSKKT\\nN\u00famero Registro AICAT 10658\\nN\u00famero API A13018 .\", \"location\": {\"visibility\": \"STREET\", \"municipality\": \"Barcelona Capital\", \"district\": \"Eixample\", \"region\": \"Barcelon\u00e8s\", \"province\": \"Barcelona\", \"address\": {\"streetName\": \"Carrer del Rossell\u00f3\", \"streetNumber\": \"334\"}, \"coordinates\": {\"latitude\": 41.4023078, \"longitude\": 2.1695036}, \"displayAddressLine\": \"Carrer del Rossell\u00f3\", \"displayZoneLine\": \"Eixample, Barcelona Capital\", \"layers\": [{\"type\": \"neighbourhood\", \"value\": \"Dreta de l'Eixample\"}, {\"type\": \"country\", \"value\": \"Espa\u00f1a\"}, {\"type\": \"autonomous_community\", \"value\": \"Catalu\u00f1a\"}, {\"type\": \"province\", \"value\": \"Barcelona\"}, {\"type\": \"region\", \"value\": \"Barcelon\u00e8s\"}, {\"type\": \"area\", \"value\": \"Barcelona, Zona de\"}, {\"t
