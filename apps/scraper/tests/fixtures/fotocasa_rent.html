a de lavadero y área de servicio.\n\n- 4 Habitaciones : 2 de ellas tipo suite con baño privado (una con salida a terraza privada). Las otras 2 habitaciones comparten un baño completo con plato de ducha.\n\n- Pasillo distribuidor con armarios empotrados de gran capacidad.\n\n· Primera Planta (Espacio polivalente o zona máster):\n\n- 1 Habitación principal de gran tamaño con salida a una tercera terraza de ensueño y vistas despejadas.\n\n- 2 Habitaciones adicionales que comparten un baño completo con plato de ducha.\n\n- Pasillo con armarios empotrados adicionales.\n\n* Calidades y Acabados Premium\n- Reforma integral a estrenar con materiales de alta calidad.\n\n- Suelos de elegante parquet en todas las estancias.\n\n- Cerramientos de aluminio con doble cristal (aislamiento térmico y acústico total).\n\n- Sistema de climatización por bomba de aire frío/calor.\n\n· Seguridad y servicios\nEl edificio posee servicio de conserjería de lunes a viernes y portero fines de semana y festivos; y servicio de vigilancia las 24hs.\n\n· Ubicación e Inmejorable Conectividad\nSituado en una de las zonas más exclusivas de Barcelona, rodeado de zonas verdes, prestigiosos centros médicos y los mejores colegios internacionales y nacionales de la ciudad. Cuenta con todo tipo de comercios y servicios a pie de calle.\n\n· Transporte público: Excelente conexión con Ferrocarriles de la Generalitat (FGC), Metro y múltiples líneas de autobús.\n\n· Conexión en coche: Acceso rápido y directo a la Ronda de Dalt (B-20) y Ronda del General Mitre.\n\nQuieres vivir en una de las mejores propiedades de Barcelona?\nNo dejes escapar esta oportunidad única. \nLlámame hoy mismo y concertamos una visita!\nEn cumplimiento del art. 20 de la Ley General para la defensa de los consumidores y usuarios (modificado por la Ley 10/2025), se informa que el PRECIO MENSUAL OFERTADO DE RENTA DE LA VIVIENDA es: 832 €, no incluye gastos e impuestos inherentes a la formalización del contrato de arrendamiento de vivienda para uso estable y permanente, correspondiendo al inquilino/arrendatario:\n\n(I) IMPUESTOS: Actualmente, el inquilino de vivienda para uso estable y permanente está exento de pagar el impuesto sobre transmisiones patrimoniales y actos jurídicos documentados, modalidad transmisiones patrimoniales onerosas. Se trata de una operación sujeta y exenta de pago (código de exención 145) y, por tanto, existe la obligación de presentar la autoliquidación del modelo 600. Para una información más exhaustiva sobre este punto, pueden consultarnos o consultar el portal oficial de la Agencia Tributaria de Cataluña.\n\n(II) GASTOS: Arrendador y arrendatario podrán pactar que los gastos generales para el adecuado sostenimiento del inmueble, sus servicios, tributos, cargas y responsabilidades que no sean susceptibles de individualización y que correspondan a la vivienda arrendada o a sus accesorios, sean a cargo del arrendatario. Este pacto constará por escrito y determinará el importe anual de dichos gastos. Los que se individualizan por aparatos contadores serán del arrendatario.\n\n(III) Honorarios de la agencia inmobiliaria: No cobramos comisión al inquilino. En caso de pacto de honorarios profesionales a cargo del inquilino, se suscribirá el correspondiente documento", "detail": {"es-ES": "/es/alquiler/vivienda/barcelona-capital/parking-ascensor/189982041/d"}, "detailWithParams": {"es-ES": "/es/alquiler/vivienda/barcelona-capital/parking-ascensor/189982041/d?from=list"}, "dynamicFeatures": ["HAS_A_FIREPLACE", "IS_EXTERIOR"], "externalContactUrl": null, "features": [{"key": "parking", "value": 5, "maxValue": 0, "minValue": 0}, {"key": "parquet", "value": 9, "maxValue": 0, "minValue": 0}, {"key": "elevator", "value": 13, "maxValue": 0, "minValue": 0}, {"key": "antiquity", "value": 7, "maxValue": 0, "minValue": 0}, {"key": "bathrooms", "value": 4, "maxValue": 0, "minValue": 0}, {"key": "conservationStatus", "value": 8, "maxValue": 0, "minValue": 0}, {"key": "floor", "value": 32, "max
